name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  buildAndroid:
    name: Build Android APK (IL2CPP + ARM64)
    runs-on: ubuntu-latest

    steps:
      - name: Free Runner Disk Space for Unity Android + IL2CPP Image
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library Folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Verify Unity Credentials Secrets
        env:
          HAS_EMAIL: ${{ secrets.UNITY_EMAIL != '' }}
          HAS_PASSWORD: ${{ secrets.UNITY_PASSWORD != '' }}
        run: |
          if [ "$HAS_EMAIL" != "true" ] || [ "$HAS_PASSWORD" != "true" ]; then
            {
              echo "## Unity Credentials Required"
              echo "Add the following two repository secrets under **Settings → Secrets and variables → Actions**:"
              echo "- \`UNITY_EMAIL\`: Your Unity ID email address"
              echo "- \`UNITY_PASSWORD\`: Your Unity ID password"
              echo ""
              echo "No PC or manual license file is required — Personal license activation runs automatically online."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Missing UNITY_EMAIL or UNITY_PASSWORD secret in GitHub Actions settings."
            exit 1
          fi
          # Unity Hub 3.20+ installs to /usr/lib/unityhub while buildalon/*@v2 checks /opt/unityhub/unityhub
          sudo mkdir -p /usr/lib/unityhub /usr/share/unity3d/config
          sudo ln -sfn /usr/lib/unityhub /opt/unityhub
          sudo chmod -R 777 /usr/share/unity3d

      - name: Setup Unity Hub and Licensing Client
        uses: buildalon/unity-setup@v2
        with:
          unity-version: None
          version-file: None
          cache-installation: true

      - name: Activate Personal Unity License Online
        uses: buildalon/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Bridge Online Activated Seat to GameCI Container
        id: license_bridge
        run: |
          python3 - <<'PY'
          import base64, glob, os, re, shutil, subprocess

          home = os.path.expanduser("~")
          unity_share = os.path.join(home, ".local", "share", "unity3d")
          unity_cfg = os.path.join(home, ".config", "unity3d")
          serial = ""

          for candidate in glob.glob(os.path.join(unity_share, "**", "*"), recursive=True):
              if not os.path.isfile(candidate):
                  continue
              try:
                  with open(candidate, "r", encoding="utf-8", errors="ignore") as fh:
                      content = fh.read()
                  m = re.search(r'<DeveloperData\s+Value="([^"]+)"', content)
                  if m:
                      decoded = base64.b64decode(m.group(1))[4:].decode("latin1").strip()
                      if decoded:
                          serial = decoded
                          break
              except Exception:
                  pass

          gh_out = os.environ["GITHUB_OUTPUT"]
          if serial:
              print(f"::add-mask::{serial}")
              if len(serial) > 4:
                  print(f"::add-mask::{serial[:-4]}XXXX")
              subprocess.run(
                  ["npx", "--yes", "@rage-against-the-pixel/unity-cli", "return-license", "-l", "personal"],
                  check=False,
              )
              with open(gh_out, "a", encoding="utf-8") as out:
                  out.write(f"serial={serial}\n")
                  out.write("skip_activation=false\n")
          else:
              container_home = os.path.join(os.environ["RUNNER_TEMP"], "_github_home")
              for src, rel in [(unity_share, ".local/share/unity3d"), (unity_cfg, ".config/unity3d")]:
                  if os.path.isdir(src):
                      dst = os.path.join(container_home, rel)
                      os.makedirs(os.path.dirname(dst), exist_ok=True)
                      shutil.copytree(src, dst, dirs_exist_ok=True)
              with open(gh_out, "a", encoding="utf-8") as out:
                  out.write("serial=ONLINE-PERSONAL\n")
                  out.write("skip_activation=true\n")
          PY

      - name: Build Android APK with GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ steps.license_bridge.outputs.serial }}
        with:
          targetPlatform: Android
          unityVersion: auto
          buildName: AsodaOpenWorld
          buildsPath: build
          skipActivation: ${{ steps.license_bridge.outputs.skip_activation }}
          androidExportType: androidPackage
          androidTargetSdkVersion: 34
          buildMethod: BuildCommand.PerformBuild
          androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_NAME }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsodaOpenWorld-Android-APK-${{ github.run_number }}
          path: build/Android/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.1.{0}', github.run_number) }}
          name: Asoda Open World Android APK (Build #${{ github.run_number }})
          files: build/Android/*.apk
          generate_release_notes: true
          make_latest: 'true'
